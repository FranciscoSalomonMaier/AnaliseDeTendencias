services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: trend_analysis
      POSTGRES_USER: trend_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trend_dev_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_app -d trend_analysis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trend_postgres_data:
